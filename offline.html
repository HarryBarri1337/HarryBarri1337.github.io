<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0b0f16" />
  <title>Offline - SkinQuest</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="skinquest-v14.css?v=1401" />
</head>
<body>
  <main class="page auth-confirm-page">
    <section class="auth-confirm-shell">
      <div class="panel auth-result">
        <span class="pill">Offline</span>
        <h1>SkinQuest cannot reach the network.</h1>
        <p class="muted">Your cached pages may still open, but balances, stock, offers and reward statuses can be outdated until you reconnect.</p>
        <div class="hero-actions">
          <button class="button button-primary" type="button" onclick="location.reload()">Try again</button>
          <a class="button button-ghost" href="/">Open cached home</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
